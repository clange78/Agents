name: Affiliate hub link check

# Weekly link health (spec §9). This is what keeps the site alive with no daily
# maintenance: it catches the silent death of a discontinued product, where the
# link still returns 200 but lands on a homepage or a search page.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'apps/affiliate-hub/content/deals.json'
      - 'apps/affiliate-hub/scripts/check-links.ts'
      - '.github/workflows/affiliate-hub-link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/affiliate-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/affiliate-hub/package-lock.json

      - run: npm ci

      - name: Check outbound links
        id: links
        continue-on-error: true
        run: npm run check-links

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-report
          path: apps/affiliate-hub/link-report.md
          retention-days: 90

      - name: Open an issue when links need attention
        if: steps.links.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('apps/affiliate-hub/link-report.md', 'utf8');
            const title = `Affiliate hub: link check failed (${new Date().toISOString().slice(0, 10)})`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-health',
            });

            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Re-checked on ${new Date().toISOString().slice(0, 10)}.\n\n${body}${footer}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['link-health'],
                body: body + footer,
              });
            }

      - name: Fail the run if links need attention
        if: steps.links.outcome == 'failure'
        run: exit 1
